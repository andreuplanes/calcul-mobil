<script id="tm-shim" type="text/plain">/*==== PANELL MÒBIL · CÀLCUL · capa de Dropbox (injectada per l'entrada del Càlcul Mòbil; l'app és la del PANELL tal qual) ====

      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error_description || j.error || ('HTTP ' + r.status));

        .then(function(){ MD[p.toLowerCase()] = { '.tag':'folder', path_display:p }; return new Dir(p, nom); });
    }); };
  Dir.prototype.getFileHandle = function(nom, o){ var p = uneix(this.path, nom), crea = !!(o && o.create);
    return md(p).then(function(m){

      if(m){ var e = new Error('és una carpeta: ' + p); e.name = 'TypeMismatchError'; throw e; }

    return D.rpc('files/delete_v2', { path:p }).then(function(){ oblida(p); }, function(e){ if(e && e.status === 409) throw noTrobat(p); throw e; }); };
  Dir.prototype._llista = function(){ var self = this, out = [];
    function seg(j){ (j.entries || []).forEach(function(e){ MD[e.path_lower] = e; out.push(e['.tag'] === 'folder' ? new Dir(e.path_display, e.name) : new Fit(e.path_display, e.name)); });
      return j.has_more ? D.rpc('files/list_folder/continue', { cursor:j.cursor }).then(seg) : out; }
    return D.rpc('files/list_folder', { path:self.path, recursive:false, limit:2000 }).then(seg); };
  function iter(dir, f){ var ll = null, i = 0; return { next:function(){ return (ll ? Promise.resolve(ll) : dir._llista().then(function(x){ ll = x; return x; })).then(function(x){ return i < x.length ? { value:f(x[i++]), done:false } : { value:undefined, done:true }; }); }, [Symbol.asyncIterator]:function(){ return this; } }; }

  Dir.prototype.keys = function(){ return iter(this, function(h){ return h.name; }); };

  Dir.prototype[Symbol.asyncIterator] = Dir.prototype.entries;

    return md(p).then(function(m){

        return D.baixa('rev:' + m.rev).then(function(b){ TXT[k] = { rev:m.rev, buf:b }; return b; }); };

$('bEntra').onclick=entra; $('bObre').onclick=obreCalcul;
document.querySelectorAll('[data-cfg]').forEach(function(b){ b.onclick=function(){ _de=document.querySelector('.pant.on').id; $('cClau').value=CFG.clau; $('cArrel').value=CFG.arrel;
  $('cInfo').innerHTML='Versió <b>'+APP_VERSION+'</b> · Càlcul: <b>'+CAMI_APP+'</b><br>Adreça per a les «Redirect URIs» de Dropbox:<br><b>'+REDIRECT+'</b>'; mostra('pCfg'); }; });
$('cTorna').onclick=function(){ mostra(_de); };
$('cDesa').onclick=function(){ CFG.clau=$('cClau').value.trim()||APP_KEY_DEFECTE; CFG.arrel=($('cArrel').value.trim()||ARREL_DEFECTE).replace(/\/+$/,''); lsSet('tm.clau',CFG.clau); lsSet('tm.arrel',CFG.arrel); mostra(_de); };
$('cSurt').onclick=function(){ if(confirm('Desconnectar aquest aparell del Dropbox? (també la Tresoreria Mòbil, que fa servir la mateixa connexió)')) desconnecta(); };
$('eVer').textContent=APP_VERSION;

/* Marc d'iPhone a l'ordinador (amb ratolí i pantalla gran) */
function muntaMarc(){
  var hz=lsGet('cm.marcVert','0')!=='1';
  document.body.innerHTML='<div style="position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;color:#fff;font-size:13px;z-index:5">'+
    '<b>Càlcul Mòbil '+APP_VERSION+'</b><span style="opacity:.75">· simulació iPhone</span>'+
    '<button id="mGira" style="border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer">⟲ Girar</button></div>'+
    '<div id="mMarc" style="position:relative;background:#0d0f14;border-radius:46px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 0 0 2px #3a3f4a;transform-origin:center center">'+
    '<iframe id="mIf" src="'+location.pathname+'?dins=1" style="display:block;border:0;border-radius:34px;background:#fff"></iframe></div>';
  document.body.style.cssText='margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#16251d;overflow:hidden';
  function posa(){ var W=hz?844:390, H=hz?390:844, f=$('mIf'), mm=$('mMarc'); f.style.width=W+'px'; f.style.height=H+'px';
    var e=Math.min(1,(window.innerWidth-40)/(W+28),(window.innerHeight-70)/(H+28)); mm.style.transform='scale('+e+')'; }
  $('mGira').onclick=function(){ hz=!hz; lsSet('cm.marcVert',hz?'0':'1'); posa(); };
  window.addEventListener('resize',posa); posa();
}
(function(){
  var qs=new URLSearchParams(location.search), code=qs.get('code'), err=qs.get('error_description')||qs.get('error');
  if(err){ $('eErr').textContent='Dropbox: '+err; history.replaceState(null,'',REDIRECT); }
  var p=Promise.resolve();
  if(code){ var verif=sessionStorage.getItem('cm.verif');
    p=tokenPost({ code:code, grant_type:'authorization_code', code_verifier:verif, client_id:CFG.clau, redirect_uri:REDIRECT }).then(function(j){
      TOKEN={ access:j.access_token, refresh:j.refresh_token||null, exp:Date.now()+(j.expires_in||14400)*1000-60000 }; lsSet('tm.token',JSON.stringify(TOKEN)); sessionStorage.removeItem('cm.verif'); history.replaceState(null,'',REDIRECT); }); }
  p.then(function(){
    if(!DINS && window.matchMedia && matchMedia('(pointer:fine)').matches && window.innerWidth>1000){ muntaMarc(); return; }
    if(!TOKEN.refresh && !TOKEN.access){ mostra('pConnecta'); return; }
    return rpc('users/get_current_account',null).then(function(a){
      var mail=(a&&a.email||'').toLowerCase(); lsSet('tm.compte',mail);
      if(USUARIS_PERMESOS.indexOf(mail)<0){ alert('Aquest compte de Dropbox ('+mail+') no pot fer servir el Càlcul.'); desconnecta(); return; }
      $('eCompte').textContent=mail; mostra('pObre'); });
  }).catch(function(e){ $('eErr').textContent='⚠ '+(e&&e.message||e); mostra(TOKEN.refresh?'pObre':'pConnecta'); });
})();
</script>
</body>
